<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spelling Quest">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Spelling Quest ⚔️</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: #f5f0e0;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    background: radial-gradient(ellipse at top, #2a1851 0%, #0f0822 60%, #050316 100%);
    background-color: #0f0822;
    background-attachment: fixed;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 50% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 33% 60%, #ffd, transparent),
      radial-gradient(2px 2px at 75% 35%, #ffd, transparent);
    background-size: 400px 400px; opacity: 0.4;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }

  /* ── HEADER ───────────────────────────────────────── */
  header {
    padding: 10px 16px;
    background: rgba(15, 8, 34, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(240, 208, 96, 0.2);
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 8px;
  }
  .brand {
    font-size: 15px; font-weight: 900; color: #f0d060;
    flex: 1; min-width: 0; background: none; border: none; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 400px) { .brand .brand-text { display: none; } }
  .pill {
    padding: 4px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 800; border: 1px solid; white-space: nowrap;
  }
  .pill-coin { background: rgba(255, 165, 0, 0.2); border-color: rgba(255, 165, 0, 0.5); color: #ffc850; }
  .pill-fire { background: rgba(255, 90, 40, 0.2); border-color: rgba(255, 120, 60, 0.5); color: #ff9a5a; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(240, 208, 96, 0.15);
    border: 1px solid rgba(240, 208, 96, 0.3);
    color: #f0d060; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  main {
    flex: 1; width: 100%; max-width: 560px; margin: 0 auto;
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
    position: relative; z-index: 1;
  }

  /* ── HOME ─────────────────────────────────────────── */
  .hero {
    background: linear-gradient(160deg, rgba(186, 85, 211, 0.35), rgba(42, 24, 81, 0.9));
    border: 2px solid rgba(240, 208, 96, 0.5);
    border-radius: 24px; padding: 20px 18px; text-align: center;
    box-shadow: 0 0 40px rgba(186, 85, 211, 0.25);
  }
  .hero-boss { font-size: 72px; line-height: 1.1; animation: bob 2.4s ease-in-out infinite; }
  .hero-boss.unknown { filter: brightness(0) drop-shadow(0 0 8px rgba(240,208,96,0.8)); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .hero-kicker { font-size: 12px; font-weight: 800; color: #f0d060; letter-spacing: 1px; margin-top: 6px; }
  .hero-title { font-size: 26px; font-weight: 900; color: #fff; margin-top: 2px; }
  .hero-sub { font-size: 14px; color: #d8cdee; margin-top: 6px; }
  .path-preview { display: flex; justify-content: center; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; }
  .path-preview span {
    background: rgba(0,0,0,0.3); border-radius: 10px; padding: 5px 8px; font-size: 12px; font-weight: 700; color: #e6dcf5;
  }
  .big-btn {
    width: 100%; margin-top: 14px; padding: 16px;
    background: linear-gradient(135deg, #ffcf33, #ff8a00);
    border: none; border-bottom: 5px solid #b45a00; border-radius: 16px;
    color: #3a1d00; font-size: 20px; font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(255, 170, 0, 0.35);
  }
  .big-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
  .hero-note { font-size: 12px; color: #b9adcc; margin-top: 8px; }

  .daily-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(15, 8, 34, 0.85); border: 1px solid rgba(240, 208, 96, 0.25);
    border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; color: #d8cdee;
  }
  .daily-row b { color: #ff9a5a; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px; padding: 14px 12px; text-align: left; color: #fff;
    display: flex; flex-direction: column; gap: 3px; min-height: 96px;
  }
  .tile:active { transform: scale(0.97); }
  .tile-icon { font-size: 30px; }
  .tile-name { font-size: 16px; font-weight: 900; }
  .tile-desc { font-size: 12px; color: #b9adcc; }

  /* ── STAGE FRAME ─────────────────────────────────── */
  .stage-top { display: flex; align-items: center; gap: 10px; }
  .quit {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 16px;
  }
  .path { flex: 1; display: flex; align-items: center; gap: 4px; }
  .path-step {
    flex: 1; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 17px; opacity: 0.55;
  }
  .path-step.done { background: rgba(74, 222, 128, 0.25); border-color: rgba(74, 222, 128, 0.6); opacity: 1; }
  .path-step.cur { background: rgba(240, 208, 96, 0.3); border-color: #f0d060; opacity: 1; transform: scale(1.08); box-shadow: 0 0 14px rgba(240,208,96,0.4); }

  .splash { text-align: center; padding: 30px 18px; }
  .splash-emoji { font-size: 90px; line-height: 1.1; animation: popIn 0.5s; }
  @keyframes popIn { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .splash-step { font-size: 12px; font-weight: 800; color: #f0d060; letter-spacing: 2px; margin-top: 10px; }
  .splash-title { font-size: 28px; font-weight: 900; color: #fff; margin-top: 4px; }
  .splash-desc { font-size: 14px; color: #d8cdee; margin-top: 10px; line-height: 1.6; }

  /* ── WHITE CARD (题目卡) ─────────────────────────── */
  .card {
    background: rgba(255, 255, 255, 0.97); border-radius: 20px; padding: 16px;
    color: #2a2118; box-shadow: 0 4px 30px rgba(106, 62, 176, 0.2);
    border: 1px solid rgba(240, 208, 96, 0.3); position: relative;
  }
  .card-label { text-align: center; font-size: 12px; font-weight: 900; color: #6b3eb0; letter-spacing: 1px; margin-bottom: 6px; }
  .game-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 900; color: #f0d060; padding: 0 4px;
  }
  .game-head span { color: #b9adcc; font-size: 13px; }

  .speak-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0; }
  .speak-btn {
    width: 76px; height: 76px; border-radius: 50%;
    background: linear-gradient(135deg, #ba55d3, #6b3eb0);
    border: 3px solid #f0d060; font-size: 34px; color: #fff;
    box-shadow: 0 4px 20px rgba(186, 85, 211, 0.5); flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.95); }
  .speak-btn.speaking { animation: glow 0.8s infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 4px 20px rgba(186, 85, 211, 0.5); }
    50% { box-shadow: 0 4px 36px rgba(255, 215, 0, 0.8), 0 0 0 8px rgba(255, 215, 0, 0.15); }
  }
  .speak-side { display: flex; flex-direction: column; gap: 6px; }
  .mini-btn {
    padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 800;
    background: #f0e8da; color: #6b3eb0; border: 1px solid #d9cbbb;
  }
  .sentence { text-align: center; font-size: 16px; color: #2a2118; margin-top: 6px; line-height: 1.5; font-weight: 600; }
  .blank { display: inline-block; min-width: 70px; border-bottom: 3px solid #ba55d3; color: transparent; }
  .meaning { text-align: center; margin-top: 4px; font-size: 13px; color: #7a6a5c; line-height: 1.4; }

  .spell-display {
    width: 100%; min-height: 56px; padding: 10px; margin-top: 10px;
    text-align: center; border: 2px solid #d9cbbb; border-radius: 12px; background: #faf6f0;
    color: #2a2118; font-size: 26px; font-weight: 800; letter-spacing: 3px;
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; word-break: break-all;
  }
  .spell-display .cursor {
    display: inline-block; width: 2px; height: 28px; background: #6b3eb0;
    margin-left: 2px; vertical-align: middle; animation: blink 1s infinite;
  }
  .spell-display .hint-txt { color: #bfad9c; font-size: 14px; letter-spacing: 0; font-weight: 600; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .spell-display.correct { border-color: #4a7c59; background: #e8f5e9; color: #2d6a3f; animation: pop 0.3s; }
  .spell-display.wrong { border-color: #c0392b; background: #fdecea; color: #c0392b; animation: shake 0.4s; }
  .spell-display.copy { border-color: #e8b04a; background: #fff9ec; }
  @keyframes pop { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  @keyframes shake {
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);} 80%{transform:translateX(5px);}
  }

  /* ── KEYBOARD ─────────────────────────────────────── */
  .keyboard {
    margin-top: 10px; padding: 8px 6px 6px;
    background: linear-gradient(180deg, rgba(106, 62, 176, 0.08), rgba(106, 62, 176, 0.15));
    border-radius: 14px; border: 1px solid rgba(106, 62, 176, 0.2);
  }
  .kb-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 5px; }
  .kb-row:last-child { margin-bottom: 0; }
  .key {
    flex: 1; min-width: 0; max-width: 42px; height: 46px;
    background: linear-gradient(180deg, #fff, #f0e8da);
    border: 1px solid #c9b8a0; border-bottom: 3px solid #8d6b4c; border-radius: 8px;
    font-size: 18px; font-weight: 800; color: #2a2118; padding: 0;
  }
  .key:active { transform: translateY(2px); border-bottom-width: 1px; background: linear-gradient(180deg, #f0e8da, #e3d6bc); }
  .key.special { max-width: 60px; font-size: 15px; background: linear-gradient(180deg, #6b3eb0, #4a2575); color: #f0d060; border-color: #4a2575; border-bottom-color: #2a1851; }
  .key.go { max-width: 220px; background: linear-gradient(180deg, #4ade80, #22a355); color: #fff; border-color: #22a355; border-bottom-color: #146b36; font-size: 16px; }
  .keyboard.dim .key { opacity: 0.35; pointer-events: none; }
  @media (max-width: 360px) { .key { height: 42px; font-size: 15px; } .kb-row { gap: 3px; } }

  /* ── BUTTONS ─────────────────────────────────────── */
  .btn { padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: 900; }
  .btn.full { width: 100%; margin-top: 10px; }
  .btn-primary { background: linear-gradient(135deg, #ba55d3, #6b3eb0); color: #fff; box-shadow: 0 4px 16px rgba(186, 85, 211, 0.4); }
  .btn-secondary { background: #f0e8da; color: #6b3eb0; }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
  .btn:disabled { opacity: 0.45; }
  .btn:active { transform: scale(0.97); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* ── FEEDBACK / DIFF ─────────────────────────────── */
  .fb { margin-top: 10px; padding: 10px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 15px; animation: popIn 0.3s; }
  .fb.ok { background: #e8f5e9; color: #2d6a3f; }
  .fb.no { background: #fff3e0; color: #b45a00; }
  .fb b { font-size: 20px; letter-spacing: 2px; }
  .diff-card { margin-top: 10px; background: linear-gradient(135deg, #fff9ec, #fff3f3); border: 2px solid #e8b04a; border-radius: 14px; padding: 12px; }
  .diff-title { font-size: 13px; font-weight: 900; color: #c0392b; margin-bottom: 6px; }
  .diff-row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .diff-lab { font-size: 12px; color: #8d6b4c; width: 44px; flex-shrink: 0; }
  .diff-word { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #5a4a3c; word-break: break-all; }
  .diff-word.ok { color: #6b3eb0; }
  .diff-bad { color: #c0392b; text-decoration: line-through; }
  .diff-miss { color: #fff; background: #e8702a; border-radius: 4px; padding: 0 1px; }
  .diff-syl { font-size: 13px; color: #8d6b4c; margin-top: 4px; text-align: center; }

  /* ── LEARN CARD ──────────────────────────────────── */
  .big-word { text-align: center; font-size: 40px; font-weight: 900; letter-spacing: 2px; margin: 8px 0 2px; word-break: break-all; line-height: 1.2; }
  .syl-a { color: #6b3eb0; } .syl-b { color: #1e88c9; }
  .tricky { color: #e53935; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
  .syl-hint { text-align: center; font-size: 15px; color: #8d6b4c; font-weight: 700; }
  .example { text-align: center; font-size: 15px; color: #2a2118; margin-top: 8px; font-style: italic; }
  .tip { text-align: center; font-size: 12px; color: #9a8a7c; margin-top: 8px; }

  /* ── BUBBLE POP ──────────────────────────────────── */
  .slots { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .slot { width: 26px; height: 34px; border-bottom: 3px solid #c9b8a0; font-size: 24px; font-weight: 900; color: #6b3eb0; text-align: center; }
  .slot.on { border-color: #6b3eb0; animation: pop 0.25s; }
  .bubble-field { position: relative; margin-top: 6px; border-radius: 14px; background: linear-gradient(180deg, #e3f4ff, #cfe9ff); overflow: hidden; }
  .bubble {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #bfe6ff 35%, #6ec3ff 100%);
    border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 3px 10px rgba(30,136,201,0.35);
    font-size: 24px; font-weight: 900; color: #0d4d7a;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .bubble.pop { animation: bubblePop 0.3s forwards; pointer-events: none; }
  @keyframes bubblePop { 0% { transform: scale(1); } 50% { transform: scale(1.4); opacity: 0.6; } 100% { transform: scale(0); opacity: 0; } }
  .bubble.shake { animation: shake 0.4s; background: radial-gradient(circle at 30% 30%, #fff 0%, #ffc9c9 40%, #ff7a7a 100%); }
  .bubble.hint { box-shadow: 0 0 0 4px #ffd700, 0 0 20px #ffd700; }

  /* ── SPOT IT ─────────────────────────────────────── */
  .timer { height: 8px; background: #eee3d3; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4ade80, #ffd700); transform-origin: left; }
  .timer-fill.run { animation: drain 10s linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .option {
    padding: 16px 6px; border-radius: 14px; background: #fff; border: 2px solid #d9cbbb; border-bottom-width: 4px;
    font-size: 20px; font-weight: 800; color: #2a2118; word-break: break-all;
  }
  .option.right { background: #e8f5e9; border-color: #4a7c59; color: #2d6a3f; }
  .option.bad { background: #fdecea; border-color: #c0392b; color: #c0392b; animation: shake 0.4s; }

  /* ── PUZZLE ──────────────────────────────────────── */
  .puzzle-slots {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center;
    min-height: 60px; padding: 10px; border: 2px dashed #d9cbbb; border-radius: 12px; background: #faf6f0; margin: 10px 0;
  }
  .puzzle-slots.bad { animation: shake 0.4s; border-color: #c0392b; }
  .puzzle-slot { padding: 8px 12px; background: linear-gradient(135deg, #6b3eb0, #4a2575); color: #f0d060; border-radius: 10px; font-size: 20px; font-weight: 800; border: none; }
  .puzzle-bank { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .puzzle-piece { min-width: 54px; padding: 12px 14px; background: #fff; border: 2px solid #ba55d3; border-bottom-width: 4px; color: #6b3eb0; border-radius: 12px; font-size: 20px; font-weight: 800; }
  .puzzle-piece.used { opacity: 0.2; pointer-events: none; }

  /* ── MISSING LETTERS ─────────────────────────────── */
  .trap-word { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; font-size: 28px; font-weight: 800; color: #2a2118; padding: 12px 4px; }
  .trap-letter { min-width: 18px; text-align: center; }
  .trap-blank { display: inline-block; width: 30px; height: 38px; text-align: center; border: 2px solid #c0392b; border-radius: 8px; background: #fff; font-size: 24px; font-weight: 800; color: #c0392b; line-height: 34px; }
  .trap-blank.active { background: #fff3cd; border-color: #ff8800; box-shadow: 0 0 0 3px rgba(255,136,0,0.3); }
  .trap-blank.correct { background: #e8f5e9; border-color: #4a7c59; color: #2d6a3f; }
  .trap-blank.wrong { background: #fdecea; }

  /* ── MATCH ───────────────────────────────────────── */
  .match-time { text-align: center; font-size: 13px; font-weight: 800; color: #6b3eb0; }
  .match-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 8px; }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .m-card {
    min-height: 64px; padding: 8px; border-radius: 12px; background: #fff; border: 2px solid #d9cbbb; border-bottom-width: 4px;
    font-size: 13px; font-weight: 700; color: #2a2118; line-height: 1.3;
  }
  .m-card.word { font-size: 17px; font-weight: 900; color: #6b3eb0; }
  .m-card.sel { border-color: #ffb300; background: #fff8e1; box-shadow: 0 0 0 3px rgba(255,179,0,0.3); }
  .m-card.bad { animation: shake 0.4s; border-color: #c0392b; }
  .m-card.gone { visibility: hidden; }

  /* ── BOSS ────────────────────────────────────────── */
  .boss-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border-radius: 18px; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.12);
    position: relative; overflow: hidden;
  }
  .boss-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 50%, var(--mc, #ba55d3) 0%, transparent 60%); opacity: 0.3; pointer-events: none; }
  .boss-row { display: flex; align-items: center; gap: 14px; position: relative; }
  .monster-art { font-size: 64px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .monster-art img { width: 70px; height: 70px; object-fit: contain; }
  .monster-art.hit { animation: monsterHit 0.5s; }
  @keyframes monsterHit {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-12px, -4px); filter: drop-shadow(0 0 20px #ff4d4d) hue-rotate(180deg) brightness(2); }
    40% { transform: translate(10px, 2px); filter: drop-shadow(0 0 20px #ff4d4d) brightness(2); }
    60% { transform: translate(-6px, 0); }
  }
  .monster-art.laugh { animation: bob 0.4s 2; }
  .boss-info { flex: 1; }
  .monster-name { font-size: 18px; font-weight: 900; color: #fff; }
  .monster-say { font-size: 12px; color: #f0d060; font-style: italic; margin-top: 2px; min-height: 16px; }

<script>
// ═══════════════════════════════════════════════════════════════════════
// 设计思路（参考 Spelling Shed / Duolingo / Blooket 等孩子爱用的产品）：
//  · 每天一轮「冒险」约 8 分钟：学新词 → 小游戏 → 默写小关 → 小游戏 → 默写 Boss
//  · 新词按英国小学的 Look · Say · Cover · Write · Check（看-读-盖-写-查）来学
//  · 只有「默写」（听音拼全词）才算真正记住，小游戏负责好玩和多次接触
//  · 复习用 Leitner 间隔重复：写对升盒（1→3→7→16→35 天后再考），写错回到第 1 盒
//  · 打败 Boss 收进图鉴，金币开宝箱抽宠物，连续打卡🔥 —— 让孩子有东西可收集
// ═══════════════════════════════════════════════════════════════════════

const APP_VER = 9
const STORE = "spelling-quest-v4"
const DAY = 86400000
const BOX_DAYS = [0, 0, 1, 3, 7, 16, 35]   // 第 n 盒写对后，多少天后再考
const MASTER_BOX = 4                        // 升到第 4 盒 = 已掌握（隔了 3 天以上还能写对）
const CHEST_COST = 30

const MONSTERS = [
  { id:"slime",    name:"Goopy",   emoji:"🟢", color:"#7ed957", say:"Goop goop! Try to spell me!" },
  { id:"bat",      name:"Batty",   emoji:"🦇", color:"#9d6bd1", say:"Squeak! Show me your magic!" },
  { id:"goblin",   name:"Grunk",   emoji:"👹", color:"#c44545", say:"Hahaha! You can't spell me!" },
  { id:"spider",   name:"Spinny",  emoji:"🕷️", color:"#5a3a8e", say:"Web of words! Bring it!" },
  { id:"ghost",    name:"Spooky",  emoji:"👻", color:"#cccfff", say:"Boooo! Spell me away!" },
  { id:"skeleton", name:"Bones",   emoji:"💀", color:"#e0d4b0", say:"Rattle rattle! Bring it on!" },
  { id:"zombie",   name:"Zomb",    emoji:"🧟", color:"#7c8a3e", say:"Braaains... or words!" },

const PETS = [
  ["🐶","Puppy",0],["🐱","Kitty",0],["🐰","Bunny",0],["🐹","Hammy",0],["🐸","Froggy",0],["🐤","Chick",0],
  ["🐢","Turtle",0],["🐞","Ladybug",0],["🐷","Piggy",0],["🐮","Moo",0],["🐔","Clucky",0],["🦆","Ducky",0],
  ["🦊","Foxy",1],["🐼","Panda",1],["🐨","Koala",1],["🐧","Penguin",1],["🦉","Owl",1],["🐬","Dolphin",1],["🦔","Spike",1],["🦦","Otter",1],
  ["🦁","Lion",2],["🐯","Tiger",2],["🦥","Sloth",2],["🦩","Flamingo",2],["🐳","Whale",2],
  ["🦄","Unicorn",3],["🐉","Dragon",3],["🦕","Dino",3],
]
const RARITY = [
  { name:"普通", cls:"", chance:0.62 },
  { name:"稀有", cls:"rar-rare", chance:0.27 },
  { name:"史诗", cls:"rar-epic", chance:0.09 },
  { name:"传说", cls:"rar-legend", chance:0.02 },
]

const GAMES = {
  bubble:  { icon:"🫧", name:"泡泡拼字", desc:"听单词，按顺序戳破字母泡泡" },
  which:   { icon:"🔍", name:"火眼金睛", desc:"4 个拼写里只有 1 个是对的，快找出来！" },
  puzzle:  { icon:"🧩", name:"音节拼图", desc:"把音节按顺序拼成单词" },
  missing: { icon:"🕳️", name:"补全陷阱", desc:"最容易错的字母被挖掉了，补上它" },
  match:   { icon:"⚡", name:"极速配对", desc:"单词和意思连连看，比比谁更快" },
}

const PRAISE = ["太棒了！", "Awesome!", "厉害！", "Perfect!", "Nice!", "一次就对！", "Great job!"]

// ═══════════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════════
const $ = (s, r = document) => r.querySelector(s)
const app = $("#app")
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]))
const norm = (s) => String(s).toLowerCase().replace(/[^a-z]/g, "")
const pick = (a) => a[Math.floor(Math.random() * a.length)]
function shuffle(a) {
  a = [...a]
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
  return a
}
function todayStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`
}
// 切换页面时 gen++，旧页面里还没触发的 setTimeout 自动作废
let gen = 0
function later(fn, ms) { const g = gen; return setTimeout(() => { if (g === gen) fn() }, ms) }

// ═══════════════════════════════════════════════════════════════════════
// WORDS
// ═══════════════════════════════════════════════════════════════════════
const BANK = WORD_BANK.map((o) => ({ ...o, key: norm(o.w) }))
const BANK_MAP = new Map(BANK.map((o) => [o.key, o]))
const customCache = new Map()

function customWord(text) {
  const key = norm(text)
  if (BANK_MAP.has(key)) return BANK_MAP.get(key)
  if (!customCache.has(key)) customCache.set(key, { w: text.trim(), s: autoSyllables(text.trim()), m: "", e: "", lv: 0, key })
  return customCache.get(key)
}
function myWords() { return S.custom.map(customWord).filter((o) => o.key) }
function allWords() {
  const extra = myWords().filter((o) => !BANK_MAP.has(o.key))
  return [...BANK, ...extra]
}
function wordByKey(key) { return BANK_MAP.get(key) || customCache.get(key) }

// 新词从哪个词包里出
function packWords() {
  const p = S.settings.pack
  if (p === "mine") return myWords()
  if (/^lv\d$/.test(p)) return BANK.filter((o) => o.lv === +p[2])
  // auto：学校词表优先，然后 1→4 级
  const seen = new Set(), out = []
  for (const o of [...myWords(), ...BANK]) if (!seen.has(o.key)) { seen.add(o.key); out.push(o) }
  return out
}

function autoSyllables(word) {
  const w = word.toLowerCase(), vowels = "aeiouy", groups = []
  let cur = "", lastV = null
  for (const c of w) {
    const isV = vowels.includes(c)
    if (lastV !== null && lastV !== isV && cur.length >= 2 && isV) { groups.push(cur); cur = c } else cur += c
    lastV = isV
  }
  if (cur) groups.push(cur)
  // 首字母大小写保持和原词一致
  if (groups.length && word[0] !== w[0]) groups[0] = word[0] + groups[0].slice(1)
  return groups.length ? groups : [word]
}

// ═══════════════════════════════════════════════════════════════════════
// STATE（localStorage）
// ═══════════════════════════════════════════════════════════════════════
let S = {
  ver: APP_VER,
  prog: {},              // key → { box, due, right, wrong, streak, last }
  coins: 0,
  settings: { newPerQuest: 4, pack: "auto" },
  custom: [],            // 学校词表（家长录入）
  collection: {},        // monsterId → { n, shiny }
  pets: {},              // emoji → count
  questNo: 0,
  daily: { lastDate: "", streak: 0, quests: 0 },
  history: [],           // 默写测验记录
  muted: false,
}

function save() { try { localStorage.setItem(STORE, JSON.stringify(S)) } catch {} }

function load() {
  let raw = null
  try { raw = localStorage.getItem(STORE) } catch {}
  if (raw) {
    try {
      const d = JSON.parse(raw)
      S = { ...S, ...d, settings: { ...S.settings, ...(d.settings || {}) }, daily: { ...S.daily, ...(d.daily || {}) } }
    } catch {}
    return
  }
  migrateV3()
  save()
}

// 从旧版 spelling-quest-v3 迁移：金币、打过的怪、每个词的对错记录都保留
function migrateV3() {
  let old = null
  try { old = JSON.parse(localStorage.getItem("spelling-quest-v3") || "null") } catch {}
  if (!old || typeof old !== "object") return
  const now = Date.now()
  const oldWords = Array.isArray(old.words) ? old.words : []
  Object.entries(old.progress || {}).forEach(([k, p]) => {
    if (!p || typeof p !== "object") return
    const word = /^\d+$/.test(k) ? (oldWords[+k] && oldWords[+k].word) : k
    if (!word) return
    const n = { right: p.correct || 0, wrong: p.wrong || 0, streak: p.consecutiveCorrect || 0, last: p.lastSeen || 0 }
    if (p.mastered) { n.box = 3; n.due = now + Math.floor(Math.random() * 7 * DAY) }   // 分散到 7 天内复查
    else if (n.right >= 2 && n.streak >= 2) { n.box = 2; n.due = now }
    else if (n.right > 0 || n.wrong > 0) { n.box = 1; n.due = now }
    else return
    S.prog[norm(word)] = n
  })
  S.custom = oldWords.map((w) => w && w.word).filter((w) => w && !BANK_MAP.has(norm(w)))
  if (typeof old.coins === "number") S.coins = old.coins
  if (typeof old.isMuted === "boolean") S.muted = old.isMuted
  if (typeof old.questIndex === "number") S.questNo = old.questIndex
  ;(old.defeatedIds || []).forEach((id) => { if (MONSTERS.some((m) => m.id === id)) S.collection[id] = { n: 1, shiny: false } })
  try {
    const d = JSON.parse(localStorage.getItem("spelling-quest-daily") || "null")
    if (d && d.date) S.daily = { lastDate: d.date, streak: Math.max(1, d.streak || 0), quests: 0 }
  } catch {}
}

// ═══════════════════════════════════════════════════════════════════════
// LEITNER 间隔重复
// ═══════════════════════════════════════════════════════════════════════
function prog(o) { return S.prog[o.key] }
function ensureProg(o) {
  return S.prog[o.key] || (S.prog[o.key] = { box: 0, due: 0, right: 0, wrong: 0, streak: 0, last: 0 })
}
function dueAfterBox(box) {
  // 提前 3 小时到期：昨天晚上练的，今天傍晚就能复习
  return box <= 1 ? Date.now() : Date.now() + BOX_DAYS[box] * DAY - 3 * 3600000
}
function setBox(o, box) {
  const p = ensureProg(o)
  p.box = box; p.due = dueAfterBox(box); p.last = Date.now()
}
// 默写成绩（只有默写才调用）
function grade(o, correct) {
  const p = ensureProg(o)
  p.last = Date.now()
  if (correct) { p.right++; p.streak++; p.box = Math.min(6, Math.max(1, p.box) + 1) }
  else { p.wrong++; p.streak = 0; p.box = 1 }
  p.due = dueAfterBox(p.box)
}
function status(o) {
  const p = prog(o)
  if (!p || !p.box) return "new"
  if (p.box >= MASTER_BOX) return "mastered"
  if (p.wrong > 0 && p.streak === 0) return "trouble"
  return "learning"
}
function isDue(o, now = Date.now()) { const p = prog(o); return !!(p && p.box > 0 && p.due <= now) }

let audioCtx = null
function tone(freq, dur, type = "sine", gain = 0.12, delay = 0) {
  if (S.muted) return
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()
    const t = audioCtx.currentTime + delay
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain()
    osc.type = type
    osc.frequency.setValueAtTime(freq, t)
    g.gain.setValueAtTime(gain, t)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
    osc.connect(g); g.connect(audioCtx.destination)
    osc.start(t); osc.stop(t + dur)
  } catch {}
}
function sfx(kind) {
  const seq = (notes, step, type, gain, dur) => notes.forEach((f, i) => tone(f, dur || step * 1.4, type, gain, i * step))
  if (kind === "ding") seq([784, 1175], 0.08, "triangle", 0.12)
  else if (kind === "wrong") seq([220, 165], 0.12, "sawtooth", 0.08)
  else if (kind === "pop") tone(600 + Math.random() * 400, 0.08, "sine", 0.15)
  else if (kind === "coin") seq([988, 1319], 0.07, "square", 0.05)
  else if (kind === "hit") { tone(880, 0.05, "square", 0.08); tone(200, 0.15, "sawtooth", 0.14, 0.06) }
  else if (kind === "win") seq([523, 659, 784, 1047, 1319], 0.1, "triangle", 0.12)
  else if (kind === "boss") seq([80, 100, 60, 80, 110], 0.15, "sawtooth", 0.14, 0.3)
  else if (kind === "start") seq([392, 523, 659], 0.1, "triangle", 0.1)
  else if (kind === "chest") seq([523, 659, 784, 988, 1175, 1568], 0.08, "triangle", 0.1)
}

function burstConfetti(x, y, count = 30, colors) {
  const host = $("#confetti-host")
  const palette = colors || ["#ffd700", "#ff7eb9", "#ba55d3", "#6b3eb0", "#ff6b00", "#4ade80"]
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div")
    p.style.cssText = `position:fixed;width:8px;height:8px;border-radius:2px;left:${x}px;top:${y}px;background:${palette[i % palette.length]};pointer-events:none;z-index:500;opacity:0;transition:transform 1.4s ease-out, opacity 1.4s ease-out;`
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5, dist = 60 + Math.random() * 140
    host.appendChild(p)
    requestAnimationFrame(() => {
      p.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist + 60}px) rotate(${Math.random() * 720 - 360}deg)`
      p.style.opacity = "1"
      setTimeout(() => { p.style.opacity = "0" }, 700)
    })
    setTimeout(() => p.remove(), 1500)
  }
}

function toast(text) {
  const t = document.createElement("div")
  t.className = "toast"; t.textContent = text
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 1500)
}

// SPEECH — 有 MP3 的词播 MP3（edge-tts Jenny），其余用系统朗读
// ═══════════════════════════════════════════════════════════════════════
const AUDIO_SET = new Set(window.AUDIO_WORDS || [])
const audioEl = new Audio()      // 复用同一个 Audio：iOS 解锁一次后可以一直自动播放
audioEl.preload = "auto"
let voice = null
function pickVoice() {
  const vs = speechSynthesis.getVoices()
  for (const name of ["Samantha", "Allison", "Ava", "Susan", "Google US English", "Jenny", "Aria"]) {
    const v = vs.find((x) => x.name.includes(name) && x.lang.startsWith("en"))
    if (v) return v
  }
  return vs.find((v) => v.lang === "en-US") || vs.find((v) => v.lang.startsWith("en")) || null
}
if (window.speechSynthesis) {
  speechSynthesis.addEventListener("voiceschanged", () => { voice = pickVoice() })
  setTimeout(() => { if (!voice) voice = pickVoice() }, 500)
}
function tts(text, rate, onend) {
  if (!window.speechSynthesis) { onend && onend(); return }
  const u = new SpeechSynthesisUtterance(text)
  if (voice) u.voice = voice
  u.lang = "en-US"; u.rate = rate; u.pitch = 1
  if (onend) u.onend = onend
  speechSynthesis.speak(u)
}
function stopSpeech() {
  try { audioEl.pause() } catch {}
  if (window.speechSynthesis) speechSynthesis.cancel()
}
function speakWord(word, { slow = false, onend } = {}) {
  if (S.muted) { onend && setTimeout(onend, 100); return }
  stopSpeech()
  const key = norm(word)
  if (AUDIO_SET.has(key)) {
    audioEl.onended = () => onend && onend()
    audioEl.src = `audio/${key}.mp3?v=${APP_VER}`
    audioEl.defaultPlaybackRate = audioEl.playbackRate = slow ? 0.7 : 1
    audioEl.play().catch(() => tts(word, slow ? 0.5 : 0.8, onend))
  } else {
    tts(word, slow ? 0.5 : 0.8, onend)
  }
}
function speakText(text) {
  if (S.muted) return
  stopSpeech()
  tts(text, 0.85)
}
// 第一次触摸时解锁音频（iOS）
let unlocked = false
document.addEventListener("pointerdown", () => {
  if (unlocked) return
  unlocked = true
  try {
    // 生成 0.05 秒静音 wav 播一下，解锁 audioEl
    const n = 400, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf)
    const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)))
    ws(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); ws(8, "WAVEfmt "); v.setUint32(16, 16, true)
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true)
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, n * 2, true)
    audioEl.src = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }))
    audioEl.play().catch(() => {})
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""))
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()
    audioCtx.resume && audioCtx.resume()
  } catch {}
}, { capture: true })

// ═══════════════════════════════════════════════════════════════════════
// SHARED PIECES
// ═══════════════════════════════════════════════════════════════════════
// 最容易拼错的位置：双写字母 → 不发音字母 → ie/ei → 元音组合 → 词尾 → 单个元音
function trickySpots(o) {
  const w = o.w.toLowerCase()
  if (o.t && o.t.length && o.t.every((i) => i < w.length)) return o.t
  const groups = []
  const add = (i, len) => groups.push([...Array(len).keys()].map((k) => i + k))
  for (let i = 0; i < w.length - 1; i++) if (w[i] === w[i + 1] && /[a-z]/.test(w[i])) { add(i, 2); i++ }
  const pats = ["kn", "wr", "mb", "gh", "rh", "ps", "gu", "ie", "ei", "ough", "augh", "eigh", "ea", "ai", "ou", "ue", "ui", "au", "eo",
    "ence", "ance", "ible", "able", "ary", "ery", "ory", "ous", "cial", "tial", "sc", "ci", "ce"]
  for (const p of pats) { let i = w.indexOf(p); while (i >= 0) { add(i, p.length); i = w.indexOf(p, i + 1) } }
  for (let i = 1; i < w.length; i++) if ("aeiouy".includes(w[i])) add(i, 1)
  const max = Math.max(2, Math.min(4, Math.ceil(w.length / 3)))
  const set = new Set()
  for (const g of groups) {
    if (g.some((i) => set.has(i)) || set.size + g.length > max) continue
    g.forEach((i) => set.add(i))
    if (set.size >= max) break
  }
  return [...set].sort((a, b) => a - b)
}

// 例句里把单词挖空，给孩子上下文但不泄露拼写
function blankSentence(o) {
  if (!o.e) return ""
  const w = norm(o.w)
  const stems = [w]
  if (w.length > 4) stems.push(w.replace(/(e|y)$/, ""))
  for (const st of stems) {
    const re = new RegExp(`\\b${st}[a-z]*`, "i")
    if (re.test(o.e)) return esc(o.e).replace(re, '<span class="blank">______</span>')
  }
  return ""
}
function clueHTML(o, { sentence = true } = {}) {
  const s = sentence ? blankSentence(o) : ""
  return `${s ? `<div class="sentence">${s}</div>` : ""}${o.m ? `<div class="meaning">${esc(o.m)}</div>` : ""}`
}

function lcsMarks(a, b) {
  const n = a.length, m = b.length
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0))
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
  const ka = new Array(n).fill(false), kb = new Array(m).fill(false)
  let i = 0, j = 0
  while (i < n && j < m) {
    if (a[i] === b[j]) { ka[i] = kb[j] = true; i++; j++ }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++
    else j++
  }
  return [ka, kb]
}
function displayWord(o) { return norm(o.w).length === o.w.length ? o.w : norm(o.w) }
function diffHTML(typed, o) {
  const a = norm(typed), b = norm(o.w), [ka, kb] = lcsMarks(a, b.toLowerCase())
  const shown = displayWord(o)
  return `<div class="diff-card">
    <div class="diff-title" data-dt>❌ 差一点！对比一下：</div>
    <div class="diff-row"><span class="diff-lab">你写的</span><span class="diff-word">${[...a].map((c, i) => ka[i] ? esc(c) : `<span class="diff-bad">${esc(c)}</span>`).join("")}</span></div>
    <div class="diff-row"><span class="diff-lab">正确</span><span class="diff-word ok">${[...shown].map((c, i) => kb[i] ? esc(c) : `<span class="diff-miss">${esc(c)}</span>`).join("")}</span></div>
    <div class="diff-syl">${o.s.map(esc).join(" · ")}</div>
  </div>`
}

function speakRow(o, { sentenceBtn = true } = {}) {
  return `<div class="speak-row">
    <button class="speak-btn" data-sp>🔊</button>
    <div class="speak-side">
      <button class="mini-btn" data-slow>🐢 慢速</button>
      ${sentenceBtn && o.e ? `<button class="mini-btn" data-sent>📢 例句</button>` : ""}
    </div>
  </div>`
}
function wireSpeak(root, o, autoplay = true) {
  const sp = root.querySelector("[data-sp]")
  const say = (slow) => { if (!sp) return; sp.classList.add("speaking"); speakWord(o.w, { slow, onend: () => sp.classList.remove("speaking") }) }
  if (sp) sp.onclick = () => say(false)
  const sl = root.querySelector("[data-slow]"); if (sl) sl.onclick = () => say(true)
  const se = root.querySelector("[data-sent]"); if (se) se.onclick = () => speakText(o.e)
  if (autoplay) say(false)
}

// ─── 默写（听音拼全词）── 冒险、Boss、测验通用 ──────────────
//  mode: pretest（不反馈）/ test（不反馈）/ learn（错了回去再看）/ check|boss（错了对比 + 照着改一遍）
function dictation(el, o, opt) {
  const mode = opt.mode, target = norm(o.w)
  let typed = "", locked = false, copying = false, firstTry = ""
  el.innerHTML = `<div class="card">
    <div class="card-label">${opt.label}</div>
    ${speakRow(o)}
    ${clueHTML(o)}
    <div class="spell-display" data-disp></div>
    <div data-fb></div>
    ${kbHTML(opt.go || "✓ 提交")}
    ${opt.extra || ""}
  </div>`
  const disp = el.querySelector("[data-disp]"), fb = el.querySelector("[data-fb]")
  const draw = () => {
    disp.innerHTML = typed || locked
      ? `<span>${esc(typed)}</span>${locked ? "" : '<span class="cursor"></span>'}`
      : `<span class="hint-txt">${copying ? "照着上面的正确拼写写一遍" : "听一听，把单词拼出来"}</span><span class="cursor"></span>`
  }
  draw()
  wireSpeak(el, o)
  const submit = () => {
    if (locked || !typed) return
    const ok = norm(typed) === target
    if (copying) {
      if (ok) { locked = true; draw(); disp.classList.add("correct"); sfx("ding"); later(() => opt.onDone(false, firstTry), 700) }
      else {
        sfx("wrong"); disp.classList.remove("wrong"); void disp.offsetWidth; disp.classList.add("wrong")
        typed = ""; later(() => { disp.classList.remove("wrong"); draw() }, 450)
      }
      return
    }
    locked = true; firstTry = typed; draw()
    if (mode === "test" || mode === "pretest") { opt.onDone(ok, typed); return }
    if (ok) { disp.classList.add("correct"); sfx("ding"); later(() => opt.onDone(true, typed), 800); return }
    disp.classList.add("wrong"); sfx("wrong")
    fb.innerHTML = diffHTML(typed, o)
    dimKb(el, true)
    if (mode === "learn") {
      fb.insertAdjacentHTML("beforeend", `<button class="btn btn-primary full" data-again>👀 再看一次</button>`)
      fb.querySelector("[data-again]").onclick = () => opt.onDone(false, typed)
      keyHandler = { enter: () => opt.onDone(false, typed) }
      return
    }
    // 照着正确拼写改一遍（订正）
    later(() => {
      copying = true; locked = false; typed = ""
      disp.classList.remove("wrong"); disp.classList.add("copy"); dimKb(el, false)
      fb.querySelector("[data-dt]").textContent = "✍️ 订正：照着正确拼写再写一遍"
      draw()
      speakWord(o.w)
    }, 1300)
  }
  bindKb(el, {
    letter: (l) => { if (locked) return; if (typed.length < 30) { typed += l; draw() } },
    back: () => { if (locked) return; typed = typed.slice(0, -1); draw() },
    enter: submit,
  })
}

// 🫧 泡泡拼字
function gBubble(el, o, answer) {
  const target = norm(o.w)
  const decoys = [...Array(3)].map(() => pick([..."abcdefghijklmnopqrstuvwxyz"]))
  const all = shuffle([...target, ...decoys])
  const cols = all.length > 12 ? 5 : 4, rows = Math.ceil(all.length / cols)
  const cells = shuffle([...Array(cols * rows).keys()]).slice(0, all.length)
  el.innerHTML = `<div class="card">
    ${speakRow(o, { sentenceBtn: false })}
    ${clueHTML(o, { sentence: false })}
    <div class="slots">${[...target].map(() => '<span class="slot"></span>').join("")}</div>
    <div class="bubble-field" style="height:${rows * 64 + 10}px">${all.map((c, i) => {
      const x = ((cells[i] % cols) + 0.5) / cols * 100, y = Math.floor(cells[i] / cols) * 64 + 6
      const jx = Math.round(Math.random() * 10 - 5)
      return `<button class="bubble" data-c="${c}" style="left:calc(${x}% - 27px + ${jx}px);top:${y}px;animation-delay:${(Math.random() * 2).toFixed(2)}s;animation-duration:${(2.4 + Math.random() * 1.6).toFixed(2)}s">${c}</button>`
    }).join("")}</div>
  </div>`
  wireSpeak(el, o)
  const slots = [...el.querySelectorAll(".slot")]
  let pos = 0, miss = 0
  const hint = () => {
    const b = [...el.querySelectorAll(".bubble:not(.pop)")].find((x) => x.dataset.c === target[pos])
    if (b) b.classList.add("hint")
  }
  const tap = (b) => {
    if (pos >= target.length || b.classList.contains("pop")) return
    if (b.dataset.c === target[pos]) {
      b.classList.add("pop"); sfx("pop")
      slots[pos].textContent = target[pos]; slots[pos].classList.add("on"); pos++
      el.querySelectorAll(".bubble.hint").forEach((x) => x.classList.remove("hint"))
      if (pos === target.length) answer(miss === 0)
    } else {
      miss++; sfx("wrong")
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake")
      if (miss >= 2) hint()
    }
  }
  el.querySelectorAll(".bubble").forEach((b) => { b.onclick = () => tap(b) })
  keyHandler = {
    letter: (l) => {
      const bs = [...el.querySelectorAll(".bubble:not(.pop)")]
      tap(bs.find((x) => x.dataset.c === l && l === target[pos]) || bs.find((x) => x.dataset.c === l) || bs[0])
    },
  }
}

// 🔍 火眼金睛：生成「看起来很像」的错误拼写
function misspell(word, n) {
  const w = word.toLowerCase(), V = "aeiou", out = new Set()
  const swapPairs = [["tion","sion"],["sion","tion"],["ence","ance"],["ance","ence"],["ent","ant"],["ant","ent"],["ible","able"],["able","ible"],
    ["ary","ery"],["ery","ary"],["ous","us"],["ture","cher"],["cial","tial"],["le","el"],["ful","full"],["ght","t"],["ough","uff"],
    ["kn","n"],["wr","r"],["mb","m"],["ph","f"],["ck","k"],["c","s"],["s","c"],["y","ey"],["ie","ei"],["ei","ie"],["ea","ee"],["ai","ay"]]
  const tries = [
    () => { const m = [...w.matchAll(/([bcdfglmnprstz])\1/g)]; if (!m.length) return; const k = pick(m); return w.slice(0, k.index) + w.slice(k.index + 1) },
    () => {
      const idx = []
      for (let i = 1; i < w.length - 1; i++) if (!V.includes(w[i]) && w[i] !== w[i + 1] && w[i] !== w[i - 1] && V.includes(w[i - 1]) && V.includes(w[i + 1])) idx.push(i)
      if (!idx.length) return
      const i = pick(idx); return w.slice(0, i) + w[i] + w.slice(i)
    },
    () => {
      const idx = []; for (let i = 1; i < w.length - 1; i++) if (V.includes(w[i])) idx.push(i)
      if (!idx.length) return
      const i = pick(idx); return w.slice(0, i) + { a: "e", e: "i", i: "e", o: "u", u: "o" }[w[i]] + w.slice(i + 1)
    },
    () => {
      const c = swapPairs.filter(([a]) => w.slice(1).includes(a)); if (!c.length) return
      const [a, b] = pick(c), i = w.lastIndexOf(a); if (i < 1) return
      return w.slice(0, i) + b + w.slice(i + a.length)
    },
    () => { if (w.length < 4) return; const i = 1 + Math.floor(Math.random() * (w.length - 3)); if (w[i] === w[i + 1]) return; return w.slice(0, i) + w[i + 1] + w[i] + w.slice(i + 2) },
    () => { if (w.length < 5) return; const i = 1 + Math.floor(Math.random() * (w.length - 2)); return w.slice(0, i) + w.slice(i + 1) },
  ]
  for (let k = 0; k < 120 && out.size < n; k++) {
    const r = pick(tries)()
    if (r && r !== w && r.length > 1 && /^[a-z]+$/.test(r)) out.add(r)
  }
  const cap = word[0] !== w[0]
  return [...out].map((x) => cap ? x[0].toUpperCase() + x.slice(1) : x)
}
function gWhich(el, o, answer) {
  const right = displayWord(o)
  const opts = shuffle([right, ...misspell(right, 3)])
  el.innerHTML = `<div class="card">
    ${speakRow(o, { sentenceBtn: false })}
    ${clueHTML(o, { sentence: false })}
    <div class="timer"><div class="timer-fill run"></div></div>
    <div class="options">${opts.map((x) => `<button class="option" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
  </div>`
  wireSpeak(el, o)
  const t0 = Date.now()
  let locked = false
  const choose = (b) => {
    if (locked) return
    locked = true
    el.querySelector(".timer-fill").style.animationPlayState = "paused"
    const ok = b.dataset.v === right
    el.querySelectorAll(".option").forEach((x) => { if (x.dataset.v === right) x.classList.add("right") })
    if (!ok) b.classList.add("bad")
    if (ok && Date.now() - t0 < 10000) { addCoins(1); toast("⚡ 速度奖励 +1🪙") }
    answer(ok)
  }
  el.querySelectorAll(".option").forEach((b) => { b.onclick = () => choose(b) })
  keyHandler = null
}

// 🧩 音节拼图
function gPuzzle(el, o, answer) {
  let parts = o.s.length >= 2 ? [...o.s] : (norm(o.w).match(/.{1,3}/g) || [o.w])
  const pieces = parts.map((s, i) => ({ s, i }))
  let sh = shuffle(pieces)
  if (sh.length > 1 && sh.every((p, i) => p.i === i)) sh = [...sh.slice(1), sh[0]]
  let placed = [], fails = 0, locked = false
  el.innerHTML = `<div class="card">
    ${speakRow(o, { sentenceBtn: false })}
    ${clueHTML(o, { sentence: false })}
    <div class="puzzle-slots" data-slots></div>
    <div class="puzzle-bank" data-bank></div>
  </div>`
  wireSpeak(el, o)
  const slotsEl = el.querySelector("[data-slots]"), bankEl = el.querySelector("[data-bank]")
  const draw = () => {
    slotsEl.innerHTML = placed.length ? placed.map((p, k) => `<button class="puzzle-slot" data-k="${k}">${esc(p.s)}</button>`).join("")
      : `<span style="color:#bfad9c;font-size:13px;">按顺序点下面的音节</span>`
    bankEl.innerHTML = sh.map((p, k) => `<button class="puzzle-piece ${placed.includes(p) ? "used" : ""}" data-k="${k}">${esc(p.s)}</button>`).join("")
    slotsEl.querySelectorAll(".puzzle-slot").forEach((b) => { b.onclick = () => { if (!locked) { placed.splice(+b.dataset.k, 1); draw() } } })
    bankEl.querySelectorAll(".puzzle-piece").forEach((b) => { b.onclick = () => { if (!locked) { placed.push(sh[+b.dataset.k]); sfx("pop"); draw(); check() } } })
  }
  const check = () => {
    if (placed.length !== sh.length) return
    if (norm(placed.map((p) => p.s).join("")) === norm(o.w)) { locked = true; answer(fails === 0); return }
    fails++; sfx("wrong")
    slotsEl.classList.remove("bad"); void slotsEl.offsetWidth; slotsEl.classList.add("bad")
    if (fails >= 2) { locked = true; answer(false); return }
    later(() => { placed = []; draw() }, 500)
  }
  draw()
  keyHandler = null
}

// 🕳️ 补全陷阱
function gMissing(el, o, answer) {
  const w = o.w, spots = trickySpots(o)
  el.innerHTML = `<div class="card">
    ${speakRow(o, { sentenceBtn: false })}
    ${clueHTML(o, { sentence: false })}
    <div class="trap-word">${[...w].map((c, i) => spots.includes(i) ? `<span class="trap-blank" data-b="${i}"></span>` : `<span class="trap-letter">${esc(c)}</span>`).join("")}</div>
    ${kbHTML("✓ 提交")}
  </div>`
  wireSpeak(el, o)
  const blanks = [...el.querySelectorAll(".trap-blank")]
  const ans = blanks.map(() => "")
  let cur = 0, locked = false
  const draw = () => blanks.forEach((b, i) => { b.textContent = ans[i]; b.classList.toggle("active", !locked && i === cur) })
  blanks.forEach((b, i) => { b.onclick = () => { if (!locked) { cur = i; draw() } } })
  draw()
  const submit = () => {
    if (locked) return
    const empty = ans.findIndex((a) => !a)
    if (empty >= 0) { cur = empty; draw(); return }
    locked = true; draw(); dimKb(el, true)
    let ok = true
    blanks.forEach((b, i) => {
      const exp = w[+b.dataset.b].toLowerCase()
      if (ans[i] === exp) b.classList.add("correct")
      else { b.classList.add("wrong"); b.textContent = exp; ok = false }
    })
    answer(ok)
  }
  bindKb(el, {
    letter: (l) => { if (locked) return; ans[cur] = l; if (cur < blanks.length - 1) cur++; draw(); if (ans.every(Boolean) && cur === blanks.length - 1) later(submit, 250) },
    back: () => { if (locked) return; if (ans[cur]) ans[cur] = ""; else if (cur > 0) { cur--; ans[cur] = "" } draw() },
    enter: submit,
  })
}

// ⚡ 极速配对（一次 4 个词）
function gMatch(el, words, done) {
  const ws = words.slice(0, 4)
  const L = shuffle(ws), R = shuffle(ws)
  const errs = new Set()
  let sel = null, matched = 0
  const t0 = Date.now()
  el.innerHTML = `<div class="game-head">${GAMES.match.icon} ${GAMES.match.name} <span data-time>⏱ 0s</span></div>
  <div class="card">
    <div class="card-label">点一个单词，再点它的意思</div>
    <div class="match-grid">
      <div class="match-col">${L.map((o) => `<button class="m-card word" data-side="L" data-k="${o.key}">${esc(displayWord(o))}</button>`).join("")}</div>
      <div class="match-col">${R.map((o) => `<button class="m-card" data-side="R" data-k="${o.key}">${esc(o.m)}</button>`).join("")}</div>
    </div>
  </div>`
  const timeEl = el.querySelector("[data-time]")
  const g = gen
  const tick = setInterval(() => { if (g !== gen) return clearInterval(tick); timeEl.textContent = `⏱ ${Math.floor((Date.now() - t0) / 1000)}s` }, 500)
  el.querySelectorAll(".m-card").forEach((b) => {
    b.onclick = () => {
      if (b.classList.contains("gone")) return
      if (b.dataset.side === "L") speakWord(wordByKey(b.dataset.k).w)
      if (!sel || sel.dataset.side === b.dataset.side) {
        if (sel) sel.classList.remove("sel")
        sel = b; b.classList.add("sel"); return
      }
      const a = sel; sel = null; a.classList.remove("sel")
      if (a.dataset.k === b.dataset.k) {
        sfx("pop"); a.classList.add("gone"); b.classList.add("gone"); matched++
        if (matched === ws.length) {
          clearInterval(tick)
          const secs = Math.round((Date.now() - t0) / 1000)
          toast(`⏱ ${secs} 秒完成！`)
          later(() => done(ws.map((o) => ({ o, correct: !errs.has(o.key) }))), 700)
        }
      } else {
        sfx("wrong")
        const wk = a.dataset.side === "L" ? a.dataset.k : b.dataset.k
        errs.add(wk)
        ;[a, b].forEach((x) => { x.classList.remove("bad"); void x.offsetWidth; x.classList.add("bad") })
      }
    }
  })
  keyHandler = null
}

// 通用：逐题跑一个小游戏
function playGame(el, key, words, n, done) {
  if (key === "match") {
    const ws = shuffle(words.filter((o) => o.m))
    if (ws.length >= 2) return gMatch(el, ws, done)
    key = "which"
  }
  const G = GAMES[key]
  const fn = { bubble: gBubble, which: gWhich, puzzle: gPuzzle, missing: gMissing }[key]
  const sh = shuffle(words), items = [...Array(n)].map((_, i) => sh[i % sh.length])
  const results = []
  let i = 0
  const next = () => {
    if (i >= items.length) return done(results)
    const o = items[i]
    el.innerHTML = `<div class="game-head">${G.icon} ${G.name} <span>${i + 1} / ${items.length}</span></div><div data-g></div>`
    const box = el.querySelector("[data-g]")
    let answered = false
    fn(box, o, (ok) => {
      if (answered) return
      answered = true; keyHandler = null
      results.push({ o, correct: ok })
      if (ok) { addCoins(1); sfx("coin") } else sfx("wrong")
      const card = box.querySelector(".card")
      if (card) card.insertAdjacentHTML("beforeend", ok
        ? `<div class="fb ok">✅ ${pick(PRAISE)} <b>${esc(displayWord(o))}</b></div>`
        : `<div class="fb no">💡 正确拼写：<b>${esc(displayWord(o))}</b></div>`)
      i++
      later(next, ok ? 1000 : 2000)
    })
  }
  next()
}

// ═══════════════════════════════════════════════════════════════════════
// QUEST（每日冒险）
// ═══════════════════════════════════════════════════════════════════════
let Q = null

function nextBoss() {
  const un = MONSTERS.filter((m) => !S.collection[m.id])
  return un.length ? un[0] : MONSTERS[S.questNo % MONSTERS.length]
}

function planQuest() {
  const now = Date.now()
  const all = allWords()
  const due = all.filter((o) => isDue(o, now)).sort((a, b) => prog(a).box - prog(b).box || prog(a).due - prog(b).due)
  const reviews = due.slice(0, 6)
  const nNew = reviews.length >= 6 ? Math.min(2, S.settings.newPerQuest) : S.settings.newPerQuest
  const fresh = packWords().filter((o) => status(o) === "new").slice(0, nNew)
  let words = [...fresh, ...reviews]
  if (words.length < 5) {
    // 没什么要复习的：随机挑学过的词再巩固一下
    const extra = shuffle(all.filter((o) => prog(o) && prog(o).box > 0 && !words.includes(o)))
    words = [...words, ...extra.slice(0, 5 - words.length)]
  }
  if (!words.length) words = shuffle(packWords().length ? packWords() : BANK).slice(0, 5)
  return { fresh, reviews, words, dueTotal: due.length }
}

function startQuest() {
  const plan = planQuest()
  const games = shuffle(Object.keys(GAMES))
  const stages = []
  if (plan.fresh.length) stages.push({ type: "learn", icon: "📖" })
  stages.push({ type: "game", icon: GAMES[games[0]].icon, game: games[0] })
  stages.push({ type: "check", icon: "✍️" })
  stages.push({ type: "game", icon: GAMES[games[1]].icon, game: games[1] })
  stages.push({ type: "boss", icon: "👾" })
  Q = { ...plan, stages, i: 0, known: new Set(), checkWrong: new Set(), boss: nextBoss(), bossRes: null }
  questCoins = 0
  sfx("start")
  runStage()
}

function quitQuest() {
  if (Q && !confirm("退出这次冒险？\n已经学过、写过的词都会保存。")) return false
  Q = null
  return true
}

function stageFrame() {
  gen++
  keyHandler = null
  stopSpeech()
  app.innerHTML = `<div class="stage-top">
      <button class="quit" id="quit">✕</button>
      <div class="path">${Q.stages.map((s, k) => `<div class="path-step ${k < Q.i ? "done" : k === Q.i ? "cur" : ""}">${k < Q.i ? "✓" : s.icon}</div>`).join("")}</div>
    </div>
    <div id="stage"></div>`
  $("#quit").onclick = () => { if (quitQuest()) home() }
  return $("#stage")
}

function stageInfo(st) {
  if (st.type === "learn") return { emoji: "📖", title: "学新词", desc: `${Q.fresh.length} 个新词！<br>先猜一猜怎么拼 → 不会就 <b>看 · 读 · 盖 · 写 · 查</b>` }
  if (st.type === "game") { const G = GAMES[st.game]; return { emoji: G.icon, title: G.name, desc: G.desc } }
  if (st.type === "check") return { emoji: "✍️", title: "默写小关", desc: "听音把整个单词写出来。<br>写错了要照着正确的订正一遍。" }
  return { emoji: Q.boss.emoji, title: `Boss：${Q.boss.name}`, desc: `默写本轮所有单词，每写对一个就攻击一次！<br>打败它就能收进你的图鉴 🏆` }
}

function runStage() {
  const st = Q.stages[Q.i]
  const el = stageFrame()
  const info = stageInfo(st)
  el.innerHTML = `<div class="splash">
    <div class="splash-emoji">${info.emoji}</div>
    <div class="splash-step">第 ${Q.i + 1} / ${Q.stages.length} 关</div>
    <div class="splash-title">${info.title}</div>
    <div class="splash-desc">${info.desc}</div>
    <button class="big-btn" id="go">GO ▶</button>
  </div>`
  if (st.type === "boss") sfx("boss")
  const go = () => {
    keyHandler = null
    const area = stageFrame()
    const next = () => { Q.i++; Q.i < Q.stages.length ? runStage() : finishQuest() }
    if (st.type === "learn") learnStage(area, next)
    else if (st.type === "game") playGame(area, st.game, Q.words, st.game === "match" ? 4 : 5, next)
    else if (st.type === "check") checkStage(area, next)
    else bossStage(area, next)
  }
  $("#go").onclick = go
  keyHandler = { enter: go }
}

// ─── 学新词：先猜 → 看/读 → 盖住默写 → 对照检查 ──────────
function learnStage(el, done) {
  let i = 0
  const next = () => { if (i >= Q.fresh.length) return done(); learnWord(el, Q.fresh[i], i, () => { i++; save(); next() }) }
  next()
}
function learnWord(el, o, idx, done) {
  const n = Q.fresh.length
  let tries = 0
  const pretest = () => {
    dictation(el, o, {
      mode: "pretest",
      label: `🤔 新词 ${idx + 1}/${n} · 先猜猜怎么拼？（猜错没关系）`,
      extra: `<button class="btn btn-secondary full" data-skip>🙋 我不会，直接学</button>`,
      onDone: (ok) => {
        if (ok) {
          Q.known.add(o.key); setBox(o, 3); addCoins(3); sfx("win")
          burstConfetti(window.innerWidth / 2, 220, 30)
          toast("🎉 你本来就会！+3🪙")
          later(done, 1300)
        } else { toast("没关系，我们来学！"); look() }
      },
    })
    el.querySelector("[data-skip]").onclick = look
  }
  const look = () => {
    gen++
    const spots = new Set(trickySpots(o))
    let pos = 0
    const wordHTML = o.s.map((syl, si) => `<span class="${si % 2 ? "syl-b" : "syl-a"}">${[...syl].map((c) => {
      const h = spots.has(pos++) ? `<span class="tricky">${esc(c)}</span>` : esc(c)
      return h
    }).join("")}</span>`).join("")
    el.innerHTML = `<div class="card">
      <div class="card-label">📖 看 · 读 — 记住它的样子</div>
      <div class="big-word">${wordHTML}</div>
      <div class="syl-hint">${o.s.map(esc).join(" · ")}</div>
      ${speakRow(o)}
      ${o.m ? `<div class="meaning" style="font-size:15px">${esc(o.m)}</div>` : ""}
      ${o.e ? `<div class="example">“${esc(o.e)}”</div>` : ""}
      <div class="tip">💡 红色下划线 = 最容易写错的地方，多看两眼</div>
      <button class="big-btn" data-cover>🙈 盖住！我来写</button>
    </div>`
    wireSpeak(el, o)
    el.querySelector("[data-cover]").onclick = write
    keyHandler = { enter: write }
  }
  const write = () => {
    gen++
    tries++
    dictation(el, o, {
      mode: "learn",
      label: `✍️ 盖住了！凭记忆写出来（第 ${tries} 次）`,
      onDone: (ok) => {
        if (ok) { setBox(o, Math.max(1, (prog(o) && prog(o).box) || 0)); addCoins(2); toast("✅ 记住了！+2🪙"); done() }
        else if (tries >= 3) { setBox(o, 1); done() }
        else look()
      },
    })
  }
  pretest()
}

// ─── 默写小关 ─────────────────────────────────────────
function checkStage(el, done) {
  const words = shuffle(Q.words).slice(0, Math.min(3, Q.words.length))
  let i = 0
  const next = () => {
    if (i >= words.length) return done()
    const o = words[i]
    dictation(el, o, {
      mode: "check",
      label: `✍️ 默写小关 ${i + 1} / ${words.length}`,
      onDone: (ok) => {
        if (ok) { addCoins(2); toast("+2🪙") } else Q.checkWrong.add(o.key)
        i++; next()
      },
    })
  }
  next()
}

// ─── Boss 默写战 ──────────────────────────────────────
function bossStage(el, done) {
  const m = Q.boss
  // 猜对的新词已经直接进第 3 盒，Boss 里不再重复考
  let words = Q.words.filter((o) => !Q.known.has(o.key)).slice(0, 8)
  Q.checkWrong.forEach((k) => { const o = wordByKey(k); if (o && !words.includes(o)) words.push(o) })
  // 只给这些词记分；太少时拿「本来就会」的词凑到 5 个，只练不记分（避免一次课就“掌握”）
  const gradedKeys = new Set(words.map((o) => o.key))
  const graded = gradedKeys.size > 0
  for (const o of shuffle(Q.words)) { if (words.length >= 5) break; if (!words.includes(o)) words.push(o) }
  const hpMax = words.length
  let hp = hpMax
  const queue = words.map((o) => ({ o, retry: false }))
  const first = new Map()
  el.innerHTML = `<div class="boss-card" style="--mc:${m.color}">
      <div class="boss-row">
        <div class="monster-art" data-art>${m.emoji}</div>
        <div class="boss-info">
          <div class="monster-name">${esc(m.name)} ${S.collection[m.id] ? "" : "<small style='color:#f0d060'>NEW</small>"}</div>
          <div class="monster-say" data-say>"${esc(m.say)}"</div>
          <div class="hp-bar"><div class="hp-fill" data-hp style="width:100%"></div></div>
          <div class="hp-num" data-hpn>${hp} / ${hpMax}</div>
        </div>
      </div>
    </div>
    <div data-dict></div>`
  const art = el.querySelector("[data-art]")
  const img = new Image()
  img.onload = () => { art.innerHTML = ""; art.appendChild(img) }
  img.src = `monsters/${m.id}.png`
  const dict = el.querySelector("[data-dict]")
  const showHp = () => {
    el.querySelector("[data-hp]").style.width = (hp / hpMax) * 100 + "%"
    el.querySelector("[data-hpn]").textContent = `${hp} / ${hpMax}`
  }
  const dmg = (text) => {
    const d = document.createElement("div"); d.className = "damage-num"; d.textContent = text
    el.querySelector(".boss-card").appendChild(d); setTimeout(() => d.remove(), 1100)
  }
  let k = 0
  const next = () => {
    if (!queue.length) {
      Q.bossRes = { words, first, captured: hp <= 0, graded }
      return done()
    }
    const it = queue.shift(); k++
    dictation(dict, it.o, {
      mode: "boss",
      go: "⚔️ 攻击！",
      label: it.retry ? `🔁 再挑战一次` : `👾 默写攻击 ${k} / ${hpMax}`,
      onDone: (ok) => {
        if (!it.retry) { first.set(it.o.key, ok); if (gradedKeys.has(it.o.key)) grade(it.o, ok) }
        if (ok) {
          hp--; showHp(); sfx("hit"); dmg("-1"); addCoins(2)
          art.classList.remove("hit"); void art.offsetWidth; art.classList.add("hit")
          el.querySelector("[data-say]").textContent = pick(['"Ouch!"', '"Nooo!"', '"Lucky shot!"', '"Argh!"'])
        } else {
          if (!it.retry) queue.push({ o: it.o, retry: true })
          art.classList.remove("laugh"); void art.offsetWidth; art.classList.add("laugh")
          el.querySelector("[data-say]").textContent = '"Ha! Try again later!"'
        }
        save()
        later(next, ok ? 600 : 300)
      },
    })
  }
  next()
}

function finishQuest() {
  const m = Q.boss, r = Q.bossRes
  const firstOk = [...r.first.values()].filter(Boolean).length
  const acc = r.first.size ? firstOk / r.first.size : 1
  const perfect = r.first.size > 0 && firstOk === r.first.size
  const captured = r.captured && acc >= 0.5
  const stars = perfect ? 3 : acc >= 0.7 ? 2 : 1
  if (captured) {
    const c = S.collection[m.id] || { n: 0, shiny: false }
    c.n++; if (perfect) c.shiny = true
    S.collection[m.id] = c
    addCoins(perfect ? 20 : 10)
  }
  addCoins(10)
  const newDay = bumpDaily()
  if (newDay && streakNow() > 1) addCoins(Math.min(streakNow(), 10))
  S.questNo++
  save()
  updateHeader()

  gen++
  keyHandler = null
  sfx(captured ? "win" : "wrong")
  if (captured) setTimeout(() => burstConfetti(window.innerWidth / 2, 180, 60), 200)
  app.innerHTML = `<div class="panel center">
    <div class="res-emoji ${captured && perfect ? "shiny" : ""}">${captured ? m.emoji : "💨"}</div>
    <div class="res-title">${captured ? (perfect ? "✨ 完美收服！" : "收服成功！") : "它逃走了…"}</div>
    <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <div class="sub">${captured ? `${esc(m.name)} 加入了你的图鉴${perfect ? "（闪光版 ✨）" : ""}` : "一半以上一次写对，就能抓住它！"}</div>
    <div class="reward-box">+${questCoins} 🪙${newDay ? `<div style="font-size:14px;margin-top:4px;color:#ff9a5a">🔥 连续打卡 ${streakNow()} 天！</div>` : ""}</div>
    <div class="word-list">${r.words.map((o) => {
      const ok = r.first.get(o.key)
      return `<div class="wl-row"><b>${esc(displayWord(o))}</b><span class="wl-meta ${ok ? "" : "bad"}">${ok ? "✅ 一次写对" : "🔁 订正过，明天再考"}</span></div>`
    }).join("")}${[...Q.known].filter((k) => !r.words.some((o) => o.key === k)).map((k) => `<div class="wl-row"><b>${esc(displayWord(wordByKey(k)))}</b><span class="wl-meta">🌟 本来就会</span></div>`).join("")}</div>
    <button class="big-btn" id="again">▶ 再来一轮</button>
    <button class="btn btn-ghost full" id="to-home">🏠 回主页</button>

function subFrame(title) {

// ═══════════════════════════════════════════════════════════════════════
// ARCADE 游戏厅
// ═══════════════════════════════════════════════════════════════════════
function practicePool(n) {
  const all = allWords()
  const now = Date.now()
  const rank = (o) => isDue(o, now) ? 0 : status(o) === "trouble" ? 1 : status(o) === "learning" ? 2 : status(o) === "mastered" ? 3 : 4
  const seen = shuffle(all.filter((o) => prog(o) && prog(o).box > 0)).sort((a, b) => rank(a) - rank(b))
  let pool = seen.slice(0, n)
  if (pool.length < n) pool = [...pool, ...packWords().filter((o) => !pool.includes(o)).slice(0, n - pool.length)]
  return pool
}
function arcade() {
  const el = subFrame("🎮 游戏厅")
  el.innerHTML = `<div class="panel">
    <div class="sub">用你正在学、该复习的单词来玩。<br>想让单词真正记住，还是要去 <b>冒险</b> 和 <b>默写</b> 哦！</div>
    <div class="opt-list">${Object.entries(GAMES).map(([k, G]) =>
      `<button class="opt-btn" data-g="${k}"><span class="oi">${G.icon}</span><span><div class="ot">${G.name}</div><div class="od">${G.desc}</div></span></button>`).join("")}
    </div>
  </div>`
  el.querySelectorAll("[data-g]").forEach((b) => { b.onclick = () => arcadeRun(b.dataset.g) })
}
function arcadeRun(key) {
  const el = subFrame(`${GAMES[key].icon} ${GAMES[key].name}`)
  $("#back").onclick = arcade
  questCoins = 0
  const words = practicePool(8)
  playGame(el, key, words, key === "match" ? 4 : 8, (res) => {
    const ok = res.filter((r) => r.correct).length
    save()
    gen++
    sfx(ok === res.length ? "win" : "ding")
    el.innerHTML = `<div class="panel center">
      <div class="res-emoji">${ok === res.length ? "🏆" : ok >= res.length / 2 ? "👍" : "💪"}</div>
      <div class="res-title">${ok} / ${res.length}</div>
      <div class="reward-box">+${questCoins} 🪙</div>
      <div class="word-list">${res.map((r) => `<div class="wl-row"><b>${esc(displayWord(r.o))}</b><span class="wl-meta ${r.correct ? "" : "bad"}">${r.correct ? "✅" : "❌"}</span></div>`).join("")}</div>
      <button class="big-btn" id="again">▶ 再玩一次</button>
      <button class="btn btn-ghost full" id="other">换个游戏</button>
    </div>`
    $("#again").onclick = () => arcadeRun(key)
    $("#other").onclick = arcade
  })
}

// ═══════════════════════════════════════════════════════════════════════
// 默写测验
// ═══════════════════════════════════════════════════════════════════════
function testMenu() {
  const el = subFrame("📝 默写测验")
  const all = allWords(), now = Date.now()
  const due = all.filter((o) => isDue(o, now))
  const trouble = all.filter((o) => status(o) === "trouble")
  const learned = all.filter((o) => prog(o) && prog(o).box > 0)
  const mine = myWords()
  const opts = [
    { k: "due", icon: "🔁", name: "该复习的词", list: due, desc: "到期的复习词（最推荐）" },
    { k: "trouble", icon: "❌", name: "错词本", list: trouble, desc: "最近写错过的词" },
    { k: "mine", icon: "🏫", name: "学校词表", list: mine, desc: mine.length ? "家长在 ⚙ 里录入的本周单词" : "在右上角 ⚙ 录入学校的单词" },
    { k: "rand", icon: "🎲", name: "随机抽查", list: learned, desc: "从学过的词里随机抽" },
  ]
  el.innerHTML = `<div class="panel">
    <div class="sub">像学校的 spelling test：听单词和例句，把整个词写出来。<br>全部写完才公布成绩，写错的词会重新进入复习。</div>
    <div class="opt-list">${opts.map((o) => `<button class="opt-btn" data-k="${o.k}" ${o.list.length ? "" : "disabled"}>
      <span class="oi">${o.icon}</span><span><div class="ot">${o.name}（${o.list.length} 词）</div><div class="od">${o.desc}</div></span></button>`).join("")}</div>
    ${S.history.length ? `<h3>最近的成绩</h3><div class="word-list">${S.history.slice(0, 5).map((h) =>
      `<div class="wl-row"><span>${esc(h.date)} · ${esc(h.name)}</span><b>${h.right} / ${h.n}</b></div>`).join("")}</div>` : ""}
  </div>`
  el.querySelectorAll("[data-k]").forEach((b) => {
    b.onclick = () => {
      const o = opts.find((x) => x.k === b.dataset.k)
      runTest(shuffle(o.list).slice(0, o.k === "mine" ? 20 : 10), o.name)
    }
  })
}
function runTest(words, name) {
  const res = []
  let i = 0
  const next = () => {
    if (i >= words.length) return testSheet(res, name)
    const el = subFrame(`📝 ${esc(name)}`)
    $("#back").onclick = () => { if (confirm("退出测验？这次成绩不会记录。")) testMenu() }
    const o = words[i]
    dictation(el, o, {
      mode: "test",
      label: `📝 第 ${i + 1} / ${words.length} 题`,
      go: i === words.length - 1 ? "✓ 交卷" : "✓ 下一题",
      onDone: (ok, typed) => { res.push({ o, ok, typed }); i++; later(next, 200) },
    })
  }
  next()
}
function testSheet(res, name) {
  const right = res.filter((r) => r.ok).length
  res.forEach((r) => grade(r.o, r.ok))
  questCoins = 0
  addCoins(right * 2)
  S.history.unshift({ date: todayStr(), name, n: res.length, right, wrong: res.filter((r) => !r.ok).map((r) => r.o.w) })
  S.history = S.history.slice(0, 30)
  save()
  const el = subFrame("📝 成绩单")
  const pct = right / res.length
  sfx(pct === 1 ? "win" : "ding")
  if (pct === 1) setTimeout(() => burstConfetti(window.innerWidth / 2, 180, 60), 200)
  const wrong = res.filter((r) => !r.ok).map((r) => r.o)
  el.innerHTML = `<div class="panel center">
    <div class="res-emoji">${pct === 1 ? "💯" : pct >= 0.8 ? "🌟" : pct >= 0.5 ? "👍" : "💪"}</div>
    <div class="res-title">${right} / ${res.length}</div>
    <div class="reward-box">+${questCoins} 🪙</div>
    <div class="word-list">${res.map((r) => `<div class="wl-row"><b>${esc(displayWord(r.o))}</b><span class="wl-meta ${r.ok ? "" : "bad"}">${r.ok ? "✅" : `<span class="wl-typed">${esc(r.typed)}</span>❌`}</span></div>`).join("")}</div>
    ${wrong.length ? `<button class="big-btn" id="fix">✍️ 订正 ${wrong.length} 个错词</button>` : ""}
    <button class="btn btn-ghost full" id="done">完成</button>
  </div>`
  if (wrong.length) $("#fix").onclick = () => fixWords(wrong)
  $("#done").onclick = home
}
// 订正：写错的词逐个再写（带对比 + 照抄），不再记分
function fixWords(words) {
  let i = 0
  const next = () => {
    if (i >= words.length) { toast("✅ 订正完成！"); return home() }
    const el = subFrame("✍️ 订正")
    dictation(el, words[i], { mode: "check", label: `✍️ 订正 ${i + 1} / ${words.length}`, onDone: () => { i++; next() } })
  }
  next()
}

// ═══════════════════════════════════════════════════════════════════════
// 单词本
// ═══════════════════════════════════════════════════════════════════════
function wordbook(tab = "trouble") {
  const el = subFrame("📚 单词本")
  const all = allWords(), now = Date.now()
  const by = { trouble: [], due: [], learning: [], mastered: [], new: [] }
  all.forEach((o) => { const s = status(o); by[s].push(o); if (isDue(o, now)) by.due.push(o) })
  const lvNames = { 1: "⭐ 1 级 · 基础必会 (英国 Y3-4)", 2: "⭐⭐ 2 级 · 高年级必会 (英国 Y5-6)", 3: "⭐⭐⭐ 3 级 · 学科词汇", 4: "⭐⭐⭐⭐ 4 级 · 挑战词" }
  const lvRow = (label, list) => {
    const m = list.filter((o) => status(o) === "mastered").length, l = list.filter((o) => status(o) !== "new").length
    return `<div class="lv-row"><div class="lv-top"><span>${label}</span><span>${m} 掌握 · ${l} 学过 / ${list.length}</span></div>
      <div class="lv-bar"><div class="lv-fill" style="width:${list.length ? (m / list.length) * 100 : 0}%"></div></div></div>`
  }
  const tabs = [["trouble", "❌ 错词"], ["due", "🔁 待复习"], ["learning", "⏳ 学习中"], ["mastered", "✅ 已掌握"], ["new", "💭 没学过"]]
  const list = by[tab]
  el.innerHTML = `<div class="panel">
    <div class="summary-grid">
      <div class="sum-box"><div class="sum-num" style="color:#4ade80">${by.mastered.length}</div><div class="sum-lab">已掌握</div></div>
      <div class="sum-box"><div class="sum-num" style="color:#ffd700">${by.learning.length}</div><div class="sum-lab">学习中</div></div>
      <div class="sum-box"><div class="sum-num" style="color:#ff8888">${by.trouble.length}</div><div class="sum-lab">错词</div></div>
      <div class="sum-box"><div class="sum-num">${all.length}</div><div class="sum-lab">总词数</div></div>
    </div>
    <h3>词包进度</h3>
    ${[1, 2, 3, 4].map((l) => lvRow(lvNames[l], BANK.filter((o) => o.lv === l))).join("")}
    ${myWords().length ? lvRow("🏫 学校词表", myWords()) : ""}
    <div class="tabs">${tabs.map(([k, t]) => `<button class="tab ${k === tab ? "on" : ""}" data-t="${k}">${t} ${by[k].length}</button>`).join("")}</div>
    <div class="chips">${list.length ? list.slice(0, 300).map((o) => {
      const p = prog(o)
      const meta = tab === "trouble" && p ? `<small>错${p.wrong}</small>` : ""
      return `<button class="chip" data-k="${o.key}">${esc(displayWord(o))}${meta}</button>`
    }).join("") : `<span class="sub">这里还没有单词</span>`}</div>
    ${tab === "trouble" && list.length ? `<button class="big-btn" id="drill">✍️ 默写这 ${Math.min(10, list.length)} 个错词</button>` : ""}
    <div class="sub" style="margin-top:12px">点单词可以听发音。一个词隔 1 天、3 天都还能写对，才算「已掌握」。</div>
  </div>`
  el.querySelectorAll("[data-t]").forEach((b) => { b.onclick = () => wordbook(b.dataset.t) })
  el.querySelectorAll(".chip").forEach((b) => { b.onclick = () => speakWord(wordByKey(b.dataset.k).w) })
  const d = $("#drill"); if (d) d.onclick = () => runTest(shuffle(list).slice(0, 10), "错词本")
}

// ═══════════════════════════════════════════════════════════════════════
// 图鉴 + 宝箱
// ═══════════════════════════════════════════════════════════════════════
function collection() {
  const el = subFrame("🏆 图鉴")
  const caught = MONSTERS.filter((m) => S.collection[m.id]).length
  const petCount = Object.keys(S.pets).length
  el.innerHTML = `<div class="panel">
    <h2>👾 怪物 ${caught} / ${MONSTERS.length}</h2>
    <div class="sub">完成冒险、打败 Boss 就能收服。全部一次写对 = ✨闪光版</div>
    <div class="coll-grid" style="margin-top:10px">${MONSTERS.map((m) => {
      const c = S.collection[m.id]
      return `<div class="coll-item ${c ? "" : "locked"} ${c && c.shiny ? "shiny" : ""}">${c && c.shiny ? '<span class="cx">✨</span>' : ""}
        <div class="ce">${m.emoji}</div><div class="cn">${c ? esc(m.name) : "???"}</div></div>`
    }).join("")}</div>
    <h3>🐾 宠物 ${petCount} / ${PETS.length}</h3>
    <button class="big-btn" id="chest" ${S.coins < CHEST_COST ? "disabled style='opacity:.5'" : ""}>🎁 开宝箱（${CHEST_COST} 🪙）</button>
    <div class="coll-grid" style="margin-top:12px">${PETS.map(([e, name, r]) => {
      const n = S.pets[e]
      return `<div class="coll-item ${n ? RARITY[r].cls : "locked"}">${n > 1 ? `<span class="cx">×${n}</span>` : ""}
        <div class="ce">${e}</div><div class="cn">${n ? esc(name) : RARITY[r].name}</div></div>`
    }).join("")}</div>
  </div>`
  $("#chest").onclick = openChest
}
function openChest() {
  if (S.coins < CHEST_COST) return
  S.coins -= CHEST_COST
  let x = Math.random(), r = 0
  while (r < RARITY.length - 1 && x > RARITY[r].chance) { x -= RARITY[r].chance; r++ }
  const [e, name] = pick(PETS.filter((p) => p[2] === r))
  const isNew = !S.pets[e]
  S.pets[e] = (S.pets[e] || 0) + 1
  save(); updateHeader(); sfx("chest")
  setTimeout(() => burstConfetti(window.innerWidth / 2, window.innerHeight / 2, r >= 2 ? 80 : 40), 150)
  $("#overlay-card").innerHTML = `<div class="res-emoji">${e}</div>
    <div class="res-title">${esc(name)}</div>
    <div class="sub" style="margin-top:6px">${RARITY[r].name}${isNew ? " · 🆕 新宠物！" : " · 已经有了，数量 +1"}</div>
    <button class="big-btn" id="ov-ok">太好了！</button>`
  $("#overlay").classList.add("open")
  $("#ov-ok").onclick = () => { $("#overlay").classList.remove("open"); collection() }
}

// 家长设置
// ═══════════════════════════════════════════════════════════════════════
function parentPanel() {
  const packs = [["auto", "🌈 自动（推荐）"], ["lv1", "⭐ 1 级"], ["lv2", "⭐⭐ 2 级"], ["lv3", "⭐⭐⭐ 3 级"], ["lv4", "⭐⭐⭐⭐ 4 级"], ["mine", "🏫 只学学校词表"]]
  const card = $("#modal-card")
  card.innerHTML = `<h2>⚙ 家长设置</h2>
    <p>每轮冒险：学几个新词 → 小游戏 → 默写小关 → 小游戏 → 默写 Boss。新词用英国小学的「Look · Say · Cover · Write · Check」来学；只有默写能让单词升级，隔 1、3、7 天还能写对才算掌握。</p>
    <h4>每轮新词数量</h4>
    <div class="seg" id="seg-n">${[2, 3, 4, 5].map((n) => `<button data-v="${n}" class="${S.settings.newPerQuest === n ? "on" : ""}">${n} 个</button>`).join("")}</div>
    <h4>新词来源</h4>
    <div class="seg" id="seg-p">${packs.map(([k, t]) => `<button data-v="${k}" class="${S.settings.pack === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <p style="margin-top:6px">自动：先学「学校词表」，再按 1 → 4 级。1/2 级是英国国家课程 Year 3-6 必会拼写词（美式拼写）。</p>
    <h4>🏫 学校词表（每行一个词，可以直接粘贴本周 spelling list）</h4>
    <textarea id="custom-input" placeholder="February&#10;necessary&#10;...">${esc(S.custom.join("\n"))}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-secondary" id="p-cancel">关闭</button>
      <button class="btn btn-primary" id="p-save">保存</button>
    </div>
    <h4 style="margin-top:20px">其他</h4>
    <button class="btn btn-secondary full" id="p-reset">🔄 清空所有单词进度（保留金币和图鉴）</button>`
  const seg = (id, key, conv) => card.querySelectorAll(`#${id} button`).forEach((b) => {
    b.onclick = () => { card.querySelectorAll(`#${id} button`).forEach((x) => x.classList.remove("on")); b.classList.add("on"); pending[key] = conv(b.dataset.v) }
  })
  const pending = { ...S.settings }
  seg("seg-n", "newPerQuest", Number)
  seg("seg-p", "pack", String)
  $("#p-cancel").onclick = closeModal
  $("#p-save").onclick = () => {
    const lines = $("#custom-input").value.split(/[\n,;]+/).map((l) => l.trim()).filter((l) => norm(l))
    S.custom = [...new Map(lines.map((l) => [norm(l), l])).values()].slice(0, 300)
    S.settings = pending
    if (S.settings.pack === "mine" && !S.custom.length) S.settings.pack = "auto"
    save(); closeModal(); toast("已保存 ✓")
    if (!Q) home()
  }
  $("#p-reset").onclick = () => {
    if (!confirm("清空所有单词的学习进度？（金币、图鉴、宠物会保留）")) return
    S.prog = {}; S.history = []; save(); closeModal(); if (!Q) home()
  }
  $("#modal").classList.add("open")
}
function closeModal() { $("#modal").classList.remove("open") }
$("#parent-btn").onclick = parentPanel
$("#modal").onclick = (e) => { if (e.target.id === "modal") closeModal() }
$("#brand").onclick = () => { if (!Q || quitQuest()) home() }
